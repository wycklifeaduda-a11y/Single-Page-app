<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8fafc">
    <title>Wordly Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <div>
                <p class="eyebrow">Your pocket reference</p>
                <h1>Wordly Dictionary</h1>
                <p class="intro">Look up a word to explore its meanings, synonyms, antonyms, and pronunciation.</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Use dark theme</button>
        </header>

        <section class="lookup" aria-label="Dictionary search">
            <form id="search-form">
                <label for="search-input">Word to look up</label>
                <div class="search-row">
                    <input type="search" id="search-input" name="word" placeholder="For example, serendipity" autocomplete="off" required>
                    <button id="search-button" type="submit">Search</button>
                </div>
            </form>
            <p id="error-message" class="message error hidden" role="alert"></p>
            <p id="loading-message" class="message hidden" role="status">Looking up your word…</p>
            <section id="response-container" class="results hidden" aria-live="polite">
                <div class="result-header">
                    <div>
                        <h2 id="word-title"></h2>
                        <p id="word-phonetic" class="phonetic"></p>
                    </div>
                    <button id="save-word-btn" class="secondary-button" type="button">Save word</button>
                </div>
                <div id="audio-container" class="audio-container hidden">
                    <audio id="definition-audio" controls preload="none"></audio>
                </div>
                <div id="word-meanings"></div>
            </section>
        </section>

        <aside id="sidebar" class="saved-panel" aria-labelledby="saved-heading">
            <div class="saved-header">
                <h2 id="saved-heading">Saved words</h2>
                <button id="clear-saved-words-btn" class="text-button" type="button">Clear all</button>
            </div>
            <ul id="sidebar-list" class="saved-list"></ul>
        </aside>
    </main>
</body>
</html>
